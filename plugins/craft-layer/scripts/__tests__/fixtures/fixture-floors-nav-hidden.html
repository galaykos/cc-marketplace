<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floors fixture probe: a one-row nav with hidden items</title>
    <!--
      One visible nav row at 1280, plus a skip link parked above the nav (outside its box) and an in-flow
      opacity-0 dropdown under its item (inside the nav's box, so only a visibility check drops it).
    -->
    <style>
      body { margin: 0; background: #fafafa; color: #111; font: 16px/1.5 system-ui, sans-serif; }
      header { padding: 12px 16px; }
      nav { position: relative; }
      .skip { position: absolute; top: -60px; left: 0; }
      nav > ul { display: flex; align-items: flex-start; gap: 24px; margin: 0; padding: 0; list-style: none; }
      .menu { opacity: 0; margin: 0; padding: 0; list-style: none; }
      main > section { padding: 24px 16px; }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a class="skip" href="#main">Skip to content</a>
        <ul>
          <li>
            <a href="#product">Product</a>
            <ul class="menu">
              <li><a href="#accounts">Accounts</a></li>
              <li><a href="#billing">Billing</a></li>
            </ul>
          </li>
          <li><a href="#pricing">Pricing</a></li>
          <li><a href="#docs">Docs</a></li>
        </ul>
      </nav>
    </header>
    <main id="main">
      <section>
        <h1>Ledgers that close themselves</h1>
      </section>
    </main>
  </body>
</html>
