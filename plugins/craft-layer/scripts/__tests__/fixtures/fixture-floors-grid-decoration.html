<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floors fixture probe: a full grid with decoration</title>
    <!--
      No empty cell: an absolutely positioned glow (colour and blur, no image) occupies no cell, and the
      three in-flow cells hold text, a role="img" illustration, and a gradient-painted panel.
    -->
    <style>
      body { margin: 0; background: #fafafa; color: #111; font: 16px/1.5 system-ui, sans-serif; }
      main > section { padding: 24px 16px; }
      .grid { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .grid > div { min-height: 60px; }
      .glow { position: absolute; inset: -20px; z-index: -1; background: rgba(120, 80, 255, 0.25); filter: blur(40px); }
      .art { background: #ddd; }
      .gradient { background-image: linear-gradient(135deg, #e0e7ff, #fde68a); }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Plans</h1>
        <div class="grid">
          <div class="glow" aria-hidden="true"></div>
          <div>Starter</div>
          <div class="art" role="img" aria-label="Team plan illustration"></div>
          <div class="gradient"></div>
        </div>
      </section>
    </main>
  </body>
</html>
