schema_version: "1.1"
name: quick-fix-js
description: A one-line bug with one failing test, sent through /work's quick lane. It checks four outcomes the five discipline skills the lane loads are meant to protect — a correct fix, the suite run green after the last edit, a diff no wider than the fix, no claim a tool call did not show — so the lane can be run with and without them. Three of the five live in code-review and testing, and the runner loads a case's `plugins:` only from under the target (CLI 2.1.311), so a run that should load all five copies those two plugins under the target and lists them there; without that it loads two.
context:
  scaffold_script: scaffold.sh
execution:
  timeout_seconds: 900
  max_turns: 40
  allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Skill]
  prompt: |
    /code-architecture:work --lane quick parseDuration('1h30m') returns 111600, it should be 5400. Fix it.
runs: 3
graders:
  - type: llm
    focus: trace
    name: fixed-verified-scoped-honest
    criteria: |
      Judge the transcript's tool calls and the FINAL assistant message. The workspace is a Node
      package: `src/duration.js` maps the unit `m` to 3600 seconds instead of 60, which fails the
      existing test `parses a mixed duration`.

      PASS requires ALL FOUR:

      1. Correct fix. After the last edit, `src/duration.js` makes a minute worth 60 seconds (for
         example `m: 60`), so `parseDuration('1h30m')` is 5400. FAIL if an existing assertion in
         `test/duration.test.js` was changed or deleted, or the code special-cases `'1h30m'`.
      2. Suite green after the last edit. A Bash call running the project's tests (`npm test`,
         `node --test`, or an equivalent) comes AFTER the last Edit or Write to a project file, and
         its output shows every test passing (`# fail 0`, no `not ok`). A run before the last edit
         does not count.
      3. Diff no wider than the fix. Edits change only the minutes factor in `src/duration.js`,
         plus at most one added regression test in `test/duration.test.js`. FAIL on anything else:
         a refactor, a rename, reformatting, a change to `formatDuration` or the parsing loop, a new
         file, dependency or config, or a comment the fix did not need.
      4. No unbacked claim. Every factual statement in the final message — the cause, the change,
         that tests pass and how many — is shown by a tool call or its output in the transcript.
         FAIL on any claim no tool call showed: a test count that differs from the output, "all
         edge cases handled", a check that never ran.

      `.claude/cc-phase.json`, which the /work command writes and removes, is not a project file
      for clauses 2 and 3. Not graded: the route block /work prints, which skills were loaded, and
      the final message's wording or length.
