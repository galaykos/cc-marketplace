schema_version: "1.1"
name: particle-sparks-culled
description: 'A v8 ParticleContainer takes Particle objects through addParticle, uploads only position unless dynamicProperties says otherwise, and computes no bounds, so a cullable one needs boundsArea (v8 migration guide; 8.22.0 ParticleContainer, Particle and Culler source).'
runs: 3
execution:
  timeout_seconds: 300
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    PixiJS 8.22. Add a spark effect to my game: 5,000 small sparks from one 8x8 texture that is already loaded
    (Assets.get('spark')). Each spark flies outward from the emitter, spins, and fades out over one second, then
    respawns. Use a ParticleContainer for speed. The effect sits in a large scrolling world in which every container,
    this one included, has cullable = true. Reply with the TypeScript only.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "pixijs:pixijs-best-practices"
    arm: with-only
  - name: v8-particles-bounded
    type: llm
    criteria: |
      Facts (PixiJS 8.22.0): ParticleContainer.addChild throws; particles are Particle objects added with addParticle
      or pushed to particleChildren followed by update(). Only position is dynamic by default; rotation and color
      (Particle.alpha and tint are written through color) are static, uploaded only when update() is called.
      ParticleContainer computes no bounds (the migration guide: provide a boundsArea), so the culler sees an empty box.
      PASS requires all three:
      1. Sparks are Particle instances added with addParticle (or particleChildren plus update()), not Sprites added
         with addChild.
      2. Spin and fade reach the GPU: dynamicProperties sets rotation and color to true, or the code calls
         container.update() every frame after changing them.
      3. The container gets a boundsArea (or a cullArea) covering the region the sparks fly through, or the reply sets
         cullable = false on it and says why.
      FAIL if any one is missing. Not graded: the motion maths, pooling, blend mode, code style.
