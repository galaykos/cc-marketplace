schema_version: "1.1"
name: filter-object-space-uv
description: 'A custom v8 filter that needs 0-1 coordinates over the sprite. vTextureCoord spans the pooled input texture, uniforms take no GLSL initialiser, and the Filter constructor takes an options object (8.22.0 filter source, GLSL ES 3.00 S0052).'
runs: 3
execution:
  timeout_seconds: 300
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    PixiJS 8.22, WebGL renderer. Write a custom filter that darkens a sprite toward its own edges (a vignette): full
    brightness at the centre of the sprite, black at its corners, with a `strength` uniform I can change at runtime.
    The sprite is 300x200 and sits somewhere on an 800x600 stage. Reply with the TypeScript and GLSL only.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "pixijs:pixijs-best-practices"
  - name: v8-filter-object-space
    type: llm
    criteria: |
      Facts (PixiJS 8.22.0 source): the default filter vertex shader sets vTextureCoord = aPosition * (uOutputFrame.zw *
      uInputSize.zw), so vTextureCoord spans the pooled input texture and is NOT 0-1 over the sprite; the 0-1 coordinate
      over the filtered area is vTextureCoord * uInputSize.xy / uOutputFrame.zw, or aPosition passed from a custom
      vertex shader. GLSL ES rejects an initialiser on a uniform (error S0052). A v8 Filter takes one options object.
      PASS requires all three:
      1. The filter is built the v8 way: new Filter({ glProgram: GlProgram.from(...) or new GlProgram(...), resources })
         or Filter.from({ gl: {...}, resources }), with the strength uniform in a resources uniform group that gives it
         a type (for example { uStrength: { value: 1, type: 'f32' } }). FAIL on the v7 form new Filter(vertex, fragment,
         uniforms).
      2. The vignette distance is computed in 0-1 space over the filtered area, by the uInputSize / uOutputFrame
         conversion or by an aPosition varying. FAIL if it treats raw vTextureCoord, or gl_FragCoord divided by the
         stage or screen size, as 0-1 over the sprite.
      3. No GLSL uniform is declared with an initialiser (uniform float uStrength = 1.0; fails).
      Not graded: the falloff curve, a WebGPU program, padding, code style.
