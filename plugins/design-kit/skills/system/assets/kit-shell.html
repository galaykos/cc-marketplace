<style>
:root {
<!-- SLOT: vars -->
}
body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1c1c1a; background: #f6f6f4; }
header { padding: 24px 28px 8px; }
header h1 { margin: 0; font-size: 22px; }
header p { margin: 4px 0 0; color: #66645d; font-size: 13px; }
nav { display: flex; gap: 12px; padding: 8px 28px 16px; font-size: 13px; }
nav a { color: #3a3a36; }
section { padding: 8px 28px 24px; }
section h2 { font-size: 14px; letter-spacing: .02em; color: #55554f; margin: 0 0 10px; }
.dk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.dk-card { background: #fff; border: 1px solid #dedcd6; border-radius: 8px; padding: 12px; min-width: 0; }
.dk-name { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.dk-sub { font-size: 11px; color: #77756e; margin-top: 2px; overflow-wrap: anywhere; }
.dk-body { margin-top: 10px; font-size: 12px; }
.dk-body code { font-size: 11px; background: #f1f0ec; padding: 1px 4px; border-radius: 3px; }
.dk-swatch { height: 44px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); margin-bottom: 6px; }
.dk-swatch.dk-dark { outline: 2px solid #1c1c1a; outline-offset: -2px; }
.dk-specimen { margin: 0 0 6px; font-size: 18px; line-height: 1.3; }
.dk-bar { height: 8px; background: #3a3a36; border-radius: 2px; margin-bottom: 6px; max-width: 100%; }
.dk-box { border: 1px solid #c9c7c0; background: #fff; height: 44px; margin-bottom: 6px; padding: 8px; box-sizing: border-box; }
.dk-box p { margin: 2px 0 0; font-size: 11px; color: #77756e; }
.dk-dot { width: 18px; height: 18px; border-radius: 50%; background: #3a3a36; transition-property: transform; transition-timing-function: ease; margin-bottom: 6px; }
.dk-card:hover .dk-dot { transform: translateX(120px); }
.dk-btn { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #1c1c1a; background: #1c1c1a; color: #fff; }
.dk-input { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #c9c7c0; width: 100%; box-sizing: border-box; }
.dk-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e8e6df; font-size: 12px; }
.dk-ph { border: 1px dashed #c9c7c0; border-radius: 6px; padding: 14px; text-align: center; color: #77756e; }
.dk-meta { margin-top: 8px; color: #55554f; font-size: 11px; overflow-wrap: anywhere; }
.dk-empty { color: #77756e; font-size: 13px; }
@media (prefers-color-scheme: dark) {
  body { background: #17171a; color: #ecebe6; }
  .dk-card, .dk-box, .dk-input { background: #202024; border-color: #37373d; }
  .dk-body code { background: #2a2a2f; }
  nav a, section h2, .dk-sub, .dk-meta, header p, .dk-empty { color: #a7a59d; }
}
</style>
</head>
