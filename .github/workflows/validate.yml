name: validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pin Node: several harnesses shell out to `node --test`, and its DEFAULT
      # REPORTER is version-dependent (older majors emit TAP `not ok` for a
      # non-TTY run, newer ones emit the spec reporter's `✖`). Left to the
      # runner image's stock Node, a GitHub image bump silently changes that
      # output and with it what negative-control.sh classifies a red as — the
      # regression behind "invalid-control ... (rc=0 want=4)", green locally and
      # red in CI. classify_red() now reads both shapes and a fixture locks that
      # in; this pin is the second layer, keeping CI and a dev machine on the
      # same major so the harnesses are compared against one Node, not two.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate marketplace structure
        run: bash scripts/validate.sh
      - name: Context-budget gate
        run: bash scripts/context-budget.sh
      - name: Check plugin version bumps
        if: github.event_name == 'pull_request'
        run: bash scripts/check-version-bumps.sh "${{ github.event.pull_request.base.sha }}"
      - name: Chassis regenerate-and-diff (enforcing)
        run: bash scripts/generate.sh --check
      - name: Template engine smoke tests
        run: bash scripts/smoke/template-engine-tests.sh
      - name: Chassis template smoke tests
        run: bash scripts/smoke/chassis-template-tests.sh
      - name: Chassis preserve-block smoke tests
        run: bash scripts/smoke/preserve-block-tests.sh
      - name: Reminder-hook guard smoke tests
        run: bash scripts/smoke/hook-guard-tests.sh
      - name: Comment-discipline hook smoke tests
        run: bash scripts/smoke/comment-discipline-hook-tests.sh
      - name: Verbosity hook smoke tests
        run: bash scripts/smoke/verbosity-hook-tests.sh
      - name: Authoring-guard smoke tests
        run: bash scripts/smoke/guard-tests.sh
      - name: Hook syntax smoke tests
        run: bash scripts/smoke/hook-syntax-tests.sh
      - name: Rules overlap-gate smoke tests
        run: bash scripts/smoke/rules-overlap-tests.sh
      - name: Route marker smoke tests
        run: bash scripts/smoke/route-marker-tests.sh
      - name: Prompt-router smoke tests
        run: bash scripts/smoke/prompt-route-tests.sh
      - name: Behavioral-verification smoke tests
        run: bash scripts/smoke/behavioral-verification-tests.sh
      - name: Completion-gate hook smoke tests
        run: bash scripts/smoke/completion-gate-hook-tests.sh
      - name: Evidence-gate hook smoke tests
        run: bash scripts/smoke/evidence-gate-hook-tests.sh
      - name: Taskmaster author-time lint tests + task-runner harnesses
        run: |
          for t in plugins/taskmaster/scripts/__tests__/*.test.sh plugins/task-runner/scripts/__tests__/*.test.sh; do
            echo "== $t"; bash "$t"
          done
      - name: validate.sh parity harness (FAIL paths still fire)
        run: bash scripts/smoke/validate-fixtures/parity-check.sh
      - name: role-floor gate harness (all nine FAIL strings fire)
        run: bash scripts/smoke/validate-fixtures/role-floors-check.sh
      - name: preview-guard twin + tier smoke tests
        run: bash scripts/smoke/preview-guard-tests.sh
      - name: doc staleness (warn-only)
        continue-on-error: true
        run: bash scripts/check-doc-staleness.sh
      # scripts/smoke/canary.sh is intentionally NOT a CI step: its own header
      # declares it "NOT a CI gate (needs a live model)". It reads
      # $HOME/.claude/plugins/cache (absent in CI), needs a delegated model round
      # to echo its proof token, and exits 1 with no args. It stays a local
      # authoring harness, run by hand.
